name: test
on:
  push:
    branches:
      - main
  pull_request:

env:
  NXF_ANSI_LOG: false
  NXF_VER: "26.04.4"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ env.NXF_VER }}"

      - name: Run nextflow lint
        run: nextflow lint . -o concise

  pytest:
    name: Run pytest (bin/ scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the versions in modules/local/mgap_report/environment.yml (the report's container)
      - name: Install the report's Python packages
        run: pip install pandas==3.0.6 plotly==7.1.0 pyyaml==6.0.3 openpyxl==3.1.5 pytest==9.1.1

      - name: Run pytest
        run: pytest tests/bin

  stub:
    name: Run pipeline stub (Nextflow ${{ matrix.NXF_VER }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the manifest minimum (nextflowVersion '!>=26.04.0') and the version
        # the pipeline is developed and tested on
        NXF_VER:
          - "26.04.0"
          - "26.04.4"
    env:
      # overrides the workflow-level NXF_VER, which the launcher would otherwise use
      NXF_VER: ${{ matrix.NXF_VER }}
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Run pipeline with stub
        run: |
          nextflow -version
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker -stub --outdir ./results

  nf-test:
    name: Run nf-test
    runs-on: ubuntu-latest
    env:
      NFT_VER: "0.9.5"
      NFT_WORKDIR: "~"
      NFT_DIFF: "pdiff"
      NFT_DIFF_ARGS: "--line-numbers --expand-tabs=2"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ env.NXF_VER }}"

      - name: Disk space cleanup
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFT_VER }}

      - name: Run nf-test
        run: |
          nf-test test --profile docker --ci
