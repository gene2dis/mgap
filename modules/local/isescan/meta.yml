name: "isescan"
description: Find insertion sequence (IS) elements in a genome assembly with ISEScan
keywords:
  - insertion sequence
  - IS element
  - transposase
  - mobile genetic elements
  - annotation
tools:
  - isescan:
      description: "Automated identification of insertion sequence elements in prokaryotic genomes"
      homepage: "https://github.com/xiezhq/ISEScan"
      documentation: "https://github.com/xiezhq/ISEScan"
      tool_dev_url: "https://github.com/xiezhq/ISEScan"
      doi: "10.1093/bioinformatics/btx433"
      licence: ["Apache-2.0"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1' ]
  - fasta:
      type: file
      description: Genome assembly (uncompressed FASTA)
      pattern: "*.{fasta,fa,fna}"
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1' ]
  - tsv:
      type: file
      description: One row per IS element (contig, family, cluster, position, length, copies, inverted repeats, transposase ORF, type c complete or p partial); header only when no IS element was found
      pattern: "*.isescan.tsv"
  - summary:
      type: file
      description: Elements and bases per IS family and contig (absent when no IS element was found)
      pattern: "*.isescan.sum"
  - gff:
      type: file
      description: IS elements and their terminal inverted repeats as GFF3 (absent when no IS element was found)
      pattern: "*.isescan.gff"
  - is_fna:
      type: file
      description: IS element sequences (absent when no IS element was found)
      pattern: "*.isescan.is.fna"
  - orf_fna:
      type: file
      description: Transposase ORF nucleotide sequences (absent when no IS element was found)
      pattern: "*.isescan.orf.fna"
  - orf_faa:
      type: file
      description: Transposase ORF protein sequences (absent when no IS element was found)
      pattern: "*.isescan.orf.faa"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@gene2dis"
maintainers:
  - "@gene2dis"
