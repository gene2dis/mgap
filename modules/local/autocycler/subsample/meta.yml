name: "autocycler_subsample"
description: Split long reads into independent subsets for the Autocycler assemblies
keywords:
  - autocycler
  - subsample
  - long reads
tools:
  - autocycler:
      description: "Consensus long-read assembly for bacterial genomes"
      homepage: "https://github.com/rrwick/Autocycler"
      documentation: "https://github.com/rrwick/Autocycler/wiki/Autocycler-subsample"
      tool_dev_url: "https://github.com/rrwick/Autocycler"
      licence: ["GPL-3.0"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1' ]
  - reads:
      type: file
      description: Long reads
      pattern: "*.{fastq,fastq.gz,fq,fq.gz}"
  - genome_size:
      type: file
      description: Estimated genome size in bases (one line)
      pattern: "*_genome_size.txt"
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1' ]
  - subsampled_reads:
      type: file
      description: Read subsets
      pattern: "subsampled_reads/*"
  - genome_size:
      type: file
      description: The input genome size file, passed through
      pattern: "*_genome_size.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@gene2dis"
maintainers:
  - "@gene2dis"
